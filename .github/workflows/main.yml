name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        dotnet-quality: 'preview' # 🎯 確保編譯伺服器能順利下載到 .NET 10 預覽版 SDK

    # 這行指令會自動尋找任何目錄下的 .csproj 並執行還原與編譯，自動解決路徑問題
    - name: Build all projects
      run: |
        find . -name "*.csproj" -print -exec dotnet restore {} \;
        find . -name "*.csproj" -print -exec dotnet build {} --configuration Release --no-restore \;

    - name: Collect Artifacts
      run: |
        mkdir -p build_output
        find . -name "*.dll" -not -path "*/obj/*" -not -path "*/bin/Debug/*" -exec cp {} build_output/ \;

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-build
        path: build_output/
